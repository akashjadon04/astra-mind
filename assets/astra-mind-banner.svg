<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" fill="none">
  <defs>
    <linearGradient id="amGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="amAgentRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="amGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="120" rx="16" fill="#0A0B14" stroke="#1F1D36" stroke-width="1.5"/>

  <!-- Orbital Agent Constellation Icon -->
  <g transform="translate(36, 20)">
    <!-- Core Hub -->
    <circle cx="40" cy="40" r="36" stroke="url(#amAgentRing)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
    <circle cx="40" cy="40" r="12" fill="#18152E" stroke="url(#amGrad)" stroke-width="2.5" />
    <circle cx="40" cy="40" r="4" fill="#E879F9" />

    <!-- 4 Specialized Agent Nodes (Grok, Gemini, GPT, Tavily) -->
    <!-- Agent 1: Top (Grok Query Refiner) -->
    <line x1="40" y1="28" x2="40" y2="12" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="40" cy="12" r="6" fill="#A855F7" filter="url(#amGlow)" />
    <circle cx="40" cy="12" r="3" fill="#FFFFFF" />

    <!-- Agent 2: Right (Research Manager / Tavily) -->
    <line x1="52" y1="40" x2="68" y2="40" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="68" cy="40" r="6" fill="#EC4899" filter="url(#amGlow)" />
    <circle cx="68" cy="40" r="3" fill="#FFFFFF" />

    <!-- Agent 3: Bottom (Gemini Dataset Extractor) -->
    <line x1="40" y1="52" x2="40" y2="68" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="40" cy="68" r="6" fill="#06B6D4" filter="url(#amGlow)" />
    <circle cx="40" cy="68" r="3" fill="#FFFFFF" />

    <!-- Agent 4: Left (GPT-4.1 Compiler) -->
    <line x1="28" y1="40" x2="12" y2="40" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="12" cy="40" r="6" fill="#3B82F6" filter="url(#amGlow)" />
    <circle cx="12" cy="40" r="3" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="136" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" letter-spacing="3" fill="#F8FAFC">ASTRA<tspan fill="url(#amGrad)">MIND</tspan></text>
  <text x="138" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" letter-spacing="2.2" fill="#A78BFA">MULTI-AGENT AI RESEARCH &amp; STRUCTURED SYNTHESIS</text>

  <!-- Status Pill -->
  <g transform="translate(530, 42)">
    <rect width="158" height="34" rx="17" fill="#18152E" stroke="#3B2D54" stroke-width="1.2" />
    <circle cx="20" cy="17" r="4.5" fill="#A855F7" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" letter-spacing="0.8">4-AGENT COLLECTIVE</text>
  </g>
</svg>